<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair-wise GSB 计量链</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d9dee7;--blue:#155eef;--red:#b42318;--green:#067647;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 24px;background:#101828;color:white;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.tabs{display:flex;gap:6px;padding:12px 24px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.tabs button{border:0;background:#eef2f7;border-radius:8px;padding:8px 12px;cursor:pointer}main{padding:20px 24px;display:grid;grid-template-columns:390px 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin:6px 0 3px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:7px 8px;border:1px solid #b8c0cc;border-radius:7px}button.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button.secondary{background:#edf2ff;color:#174ea6;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button.danger{background:#fff1f0;color:var(--red);border:1px solid #fda29b;border-radius:8px;padding:7px;cursor:pointer}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.error{background:#fef3f2;border:1px solid #fda29b;color:var(--red);padding:10px;border-radius:8px;white-space:pre-wrap}.ok{color:var(--green)}.wait{color:var(--amber)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e7eaf0;padding:6px;text-align:left;vertical-align:top}th{color:#475467;background:#f9fafb}#graph{min-height:360px;border:1px dashed #c3cad6;border-radius:10px;background:#fcfcfd;overflow:auto}.node{position:absolute;min-width:150px;padding:10px;border:2px solid #344054;background:#fff;border-radius:10px;box-shadow:0 3px 10px #0001}.node.ready{border-color:var(--green)}.node.wait{border-color:var(--amber)}svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pill{display:inline-block;border-radius:999px;padding:2px 8px;background:#eef2f7;font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#d1e7ff;padding:12px;border-radius:10px;max-height:360px;overflow:auto}.hidden{display:none}@media(max-width:980px){main{grid-template-columns:1fr}.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Pair-wise GSB 可复核计量链</h1><div class="muted" style="color:#c7d7fe">服务端规则版本：<span id="rule"></span></div></div><button class="secondary" id="refresh">刷新状态</button></header>
<nav class="tabs"><button data-tab="inputs">输入</button><button data-tab="build">方案/图</button><button data-tab="results">结果对比</button><button data-tab="certs">证书</button><button data-tab="audit">审计</button></nav>
<main>
<section>
<div id="msg"></div>
<div class="card tab" data-tab="inputs">
<h3>原始观测</h3><div class="grid"><div><label>ID</label><input id="obsId" value="o1"></div><div><label>名称</label><input id="obsName" value="样品 A"></div><div><label>观测值</label><input id="obsValue" type="number" value="10.02"></div><div><label>单位</label><input id="obsUnit" value="mm"></div><div><label>标准不确定度 u(x)</label><input id="obsU" type="number" value=".05"></div><div><label>分布</label><select id="obsDist"><option>normal</option><option>rectangular</option><option>triangular</option><option>t</option><option>unknown</option></select></div><div><label>自由度</label><input id="obsDF" type="number" value="9"></div><div><label>相关组</label><select id="obsGroup"></select></div></div><p><button class="primary" id="addObs">新增观测</button></p>
<h3>相关组（组内同一相关系数）</h3><div class="grid"><div><label>ID</label><input id="groupId" value="g1"></div><div><label>相关系数 ρ</label><input id="groupRho" type="number" step="any" value="0.3"></div></div><button class="secondary" id="addGroup">新增组</button>
</div>
<div class="card tab hidden" data-tab="build">
<h3>候选方案节点</h3><div class="grid"><div><label>方案 ID</label><input id="scId" value="s1"></div><div><label>名称</label><input id="scName" value="主方案"></div><div><label>输出节点</label><input id="outNode" value="out"></div></div><div id="nodeForms"></div><p class="row"><button class="secondary" data-node="observation">观测</button><button class="secondary" data-node="conversion">换算</button><button class="secondary" data-node="weighted">加权</button><button class="secondary" data-node="difference">差值</button><button class="secondary" data-node="calibration">校准</button></p><label>相关性覆盖（两两；复制方案时调整）</label><textarea id="overrides" rows="3">[]</textarea><button class="primary" id="saveScenario">创建并计算方案</button>
</div>
<div class="card tab hidden" data-tab="results">
<h3>方案操作</h3><div class="row"><select id="scSelect"></select><button class="primary" id="freeze">冻结</button></div><div class="grid" style="margin-top:8px"><div><label>副本 ID</label><input id="copyId" value="s2"></div><div><label>副本名称</label><input id="copyName" value="相关性敏感性"></div></div><label>副本相关性覆盖 JSON</label><textarea id="copyOverrides" rows="3">[]</textarea><button class="secondary" id="copy">复制后调整相关性</button>
<h3>并排比较</h3><input id="compareIds" value="s1,s2" placeholder="s1,s2"><p><button class="primary" id="compare">查看结论变化</button></p><div id="compareBox" class="compare"></div>
</div>
<div class="card tab hidden" data-tab="certs">
<h3>校准证书</h3><div class="grid"><div><label>ID</label><input id="certId" value="c1"></div><div><label>名称</label><input id="certName" value="标准量块"></div><div><label>修正值</label><input id="certCorrection" type="number" step="any" value=".01"></div><div><label>单位</label><input id="certUnit" value="mm"></div><div><label>u(cert)</label><input id="certU" type="number" step="any" value=".02"></div><div><label>自由度</label><input id="certDF" type="number" value="20"></div><div><label>生效</label><input id="validFrom" type="datetime-local"></div><div><label>到期</label><input id="expiresAt" type="datetime-local"></div></div><button class="primary" id="addCert">新增证书</button>
<h3>替换证书</h3><div class="grid"><div><label>旧证书</label><select id="oldCert"></select></div><div><label>新证书 ID</label><input id="newCertId" value="c2"></div></div><button class="secondary" id="replaceCert">预览受影响结果并替换</button><div id="replaceResult"></div><div class="row" style="margin-top:8px"><button class="primary" id="recalcOne">逐个重算所选</button><button class="danger" id="recalcAtomic">原子批次重算</button></div>
</div>
<div class="card tab hidden" data-tab="audit"><h3>审计包</h3><label>方案 ID，留空导出全部（逗号分隔）</label><input id="auditIds" value="s1,s2"><div class="row"><button class="primary" id="exportAudit">导出</button><button class="secondary" id="downloadAudit">下载 JSON</button><button class="secondary" id="importAudit">重新导入当前审计包并校验</button></div><pre id="auditBox"></pre></div>
</section>
<section>
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">依赖图</h3><span class="muted">绿色=ready，橙色=等待确认；边定位在问题详情中</span></div><div id="graph"></div></div>
<div class="card"><h3>当前状态</h3><div id="state" style="max-height:330px;overflow:auto"></div></div>
</section>
</main>
<script>
let state={observations:{},groups:{},certificates:{},scenarios:{},results:{},frozenResults:{}};
let nodes=[
 {id:'a',type:'observation',observationId:'o1'},{id:'b',type:'observation',observationId:'o2'},
 {id:'out',type:'difference',leftId:'a',rightId:'b'}
];
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function api(path,opts={}){const reqId=opts.requestId||crypto.randomUUID();return fetch(path,{headers:{'Content-Type':'application/json','X-Request-ID':reqId},...opts,body:opts.body?JSON.stringify(opts.body):undefined}).then(async r=>{const t=await r.text();let data=t?JSON.parse(t):{};if(!r.ok){showError(data);throw data}return data})}
function showError(e){$('msg').innerHTML=`<div class="error">${esc(e.error?.code||'ERROR')}: ${esc(e.error?.message||e.message)}${(e.error?.details||[]).map(x=>`\n- ${x.code} node=${x.nodeId||''} edge=${x.edge||''} input=${x.inputId||''} ${x.message||''}`).join('')}</div>`}
function clearMsg(){$('msg').innerHTML=''}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.dataset.tab!==b.dataset.tab))});
$('refresh').onclick=load;
$('addGroup').onclick=()=>api('/api/groups',{method:'POST',body:{id:$('groupId').value,name:$('groupId').value,coefficient:Number($('groupRho').value)}}).then(load).catch(()=>{});
$('addObs').onclick=()=>api('/api/observations',{method:'POST',body:{id:$('obsId').value,name:$('obsName').value,value:Number($('obsValue').value),unit:$('obsUnit').value,standardUncertainty:Number($('obsU').value),distribution:$('obsDist').value,degreesOfFreedom:Number($('obsDF').value),correlationGroupId:$('obsGroup').value}}).then(load).catch(()=>{});
$('addCert').onclick=()=>api('/api/certificates',{method:'POST',body:{id:$('certId').value,name:$('certName').value,correction:Number($('certCorrection').value),unit:$('certUnit').value,standardUncertainty:Number($('certU').value),degreesOfFreedom:Number($('certDF').value),validFrom:new Date($('validFrom').value).toISOString(),expiresAt:new Date($('expiresAt').value).toISOString()}}).then(load).catch(()=>{});
document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{nodes.push(defaultNode(b.dataset.node));renderNodeForms()});
function defaultNode(t){if(t==='observation')return{id:'n'+(nodes.length+1),type:'observation',observationId:Object.keys(state.observations)[0]||'o1'};if(t==='conversion')return{id:'n'+(nodes.length+1),type:'conversion',inputId:lastId(),fromUnit:'mm',toUnit:'m'};if(t==='weighted')return{id:'n'+(nodes.length+1),type:'weighted',inputIds:[]};if(t==='difference')return{id:'n'+(nodes.length+1),type:'difference',leftId:lastId(),rightId:lastId()};return{id:'n'+(nodes.length+1),type:'calibration',inputId:lastId(),certificateId:Object.keys(state.certificates)[0]||'c1'}}
function lastId(){return nodes[nodes.length-1]?.id||''}
function renderNodeForms(){$('nodeForms').innerHTML=nodes.map((n,i)=>`<label>${i}: ${n.type} <button class="danger" onclick="removeNode(${i})">删除</button></label><textarea rows="3" onchange="nodes[${i}]=JSON.parse(this.value)">${JSON.stringify(n)}</textarea>`).join('')}
window.removeNode=i=>{nodes.splice(i,1);renderNodeForms()};
$('saveScenario').onclick=()=>{clearMsg();api('/api/scenarios',{method:'POST',body:{id:$('scId').value,name:$('scName').value,outputNodeId:$('outNode').value,nodes:JSON.parse(JSON.stringify(nodes)),correlationOverrides:JSON.parse($('overrides').value||'[]')}}).then(load).catch(()=>{})};
$('freeze').onclick=()=>api(`/api/scenarios/${$('scSelect').value}/freeze`,{method:'POST'}).then(load).catch(()=>{});
$('copy').onclick=()=>api(`/api/scenarios/${$('scSelect').value}/copy`,{method:'POST',body:{id:$('copyId').value,name:$('copyName').value,correlationOverrides:JSON.parse($('copyOverrides').value||'[]')}}).then(load).catch(()=>{});
$('compare').onclick=()=>api('/api/scenarios/x/comparison?ids='+encodeURIComponent($('compareIds').value)).then(drawCompare).catch(()=>{});
$('replaceCert').onclick=()=>api(`/api/certificates/${$('oldCert').value}/replace`,{method:'POST',body:{newId:$('newCertId').value,newCertificate:{id:$('newCertId').value,name:'替换证书',correction:Number($('certCorrection').value),unit:$('certUnit').value,standardUncertainty:Number($('certU').value),degreesOfFreedom:Number($('certDF').value),validFrom:new Date($('validFrom').value).toISOString(),expiresAt:new Date($('expiresAt').value).toISOString()}}}).then(x=>{$('replaceResult').innerHTML=`<pre>${esc(JSON.stringify(x,null,2))}</pre>`;window.affected=x.affectedScenarioIds}).then(load).catch(()=>{});
$('recalcOne').onclick=()=>api('/api/recalculations',{method:'POST',body:{scenarioIds:window.affected||[$('scSelect').value]}}).then(load).catch(()=>{});
$('recalcAtomic').onclick=()=>api('/api/recalculations/atomic',{method:'POST',body:{scenarioIds:window.affected||[$('scSelect').value]}}).then(load).catch(()=>{});
let auditData=null;$('exportAudit').onclick=()=>api('/api/audits/export',{method:'POST',body:{scenarioIds:$('auditIds').value.split(',').map(x=>x.trim()).filter(Boolean)}}).then(x=>{auditData=x;$('auditBox').textContent=JSON.stringify(x,null,2)});$('downloadAudit').onclick=()=>{if(!auditData)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(auditData,null,2)],{type:'application/json'}));a.download='metrology-audit.json';a.click()};$('importAudit').onclick=()=>api('/api/audits/import',{method:'POST',body:auditData}).then(x=>{$('auditBox').textContent=JSON.stringify(x,null,2);load()}).catch(()=>{});
async function load(){state=await fetch('/api/state').then(r=>r.json());state.results=state.activeResults||{};$('rule').textContent=state.schemaVersion+' / '+state.ruleSetVersion;renderSelectors();renderGraph();renderState();renderNodeForms();drawCompareFromState()}
function renderSelectors(){const opts=o=>Object.keys(o).map(x=>`<option>${x}</option>`).join('');const selected=$('scSelect').value;$('obsGroup').innerHTML='<option value=""></option>'+opts(state.groups);$('scSelect').innerHTML=opts(state.scenarios);if(selected&&state.scenarios[selected])$('scSelect').value=selected;$('oldCert').innerHTML=opts(state.certificates);$('scSelect').onchange=renderGraph}
function edges(n){return n.type==='difference'?[[n.leftId,n.id],[n.rightId,n.id]]:n.type==='weighted'?(n.inputIds||[]).map(x=>[x,n.id]):n.inputId?[[n.inputId,n.id]]:[]}
function renderGraph(){const ids=Object.values(state.scenarios).find(x=>x.id===$('scSelect').value)?.nodes||nodes;const result=state.results[$('scSelect').value];const byId=Object.fromEntries(ids.map((n,i)=>[n.id,{...n,x:40+(i%4)*180,y:30+Math.floor(i/4)*130}]));const links=ids.flatMap(n=>edges(n));const w=Math.max(820,...Object.values(byId).map(n=>n.x+180)),h=Math.max(390,...Object.values(byId).map(n=>n.y+110));$('graph').innerHTML=`<svg class="links" width="${w}" height="${h}">${links.map(([a,b])=>{const p=byId[a],q=byId[b];if(!p||!q)return'';return `<line x1="${p.x+150}" y1="${p.y+40}" x2="${q.x}" y2="${q.y+40}" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker></defs>`}).join('')}</svg>`+ids.map(n=>{const nr=result?.nodes?.[n.id];const st=result?.status==='ready'?'ready':(nr?'wait':'');return `<div class="node ${st}" style="left:${byId[n.id].x}px;top:${byId[n.id].y}px"><b>${esc(n.id)}</b><div class="pill">${n.type}</div><div class="muted">${nr?fmt(nr.value)+' '+nr.unit:'未计算'}</div><div>u=${nr?fmt(nr.standardUncertainty):'-'}</div><div class="mono">${esc(nr?.formulaVersion||'')}</div></div>`}).join('')}
function renderState(){const sc=Object.values(state.scenarios);$('state').innerHTML=`<table><tr><th>方案</th><th>状态</th><th>值 / 区间</th><th>贡献率</th><th>问题</th></tr>${sc.map(s=>{const r=state.results[s.id]||{};return `<tr><td><b>${esc(s.id)}</b><br>${esc(s.name)}${s.frozenResultId?'<br><span class="ok">已冻结 '+esc(s.frozenResultId)+'</span>':''}</td><td class="${r.status==='ready'?'ok':'wait'}">${esc(r.status)}</td><td>${fmt(r.value)} ${esc(r.unit||'')}<br>[${fmt(r.lowerBound)}, ${fmt(r.upperBound)}]<br>k=${fmt(r.coverageFactor)}, ν=${fmt(r.degreesOfFreedom)}</td><td>${(r.contributions||[]).slice(0,4).map(c=>`#${c.rank} ${esc(c.sourceId)}: ${(c.fraction*100).toFixed(1)}%`).join('<br>')}</td><td>${(r.blockingIssues||[]).map(i=>`${i.code}<br><span class="mono">${esc(i.edge||i.inputId||'')}</span>`).join('<br>')}</td></tr>`}).join('')}</table>`}
function drawCompareFromState(){const ids=$('compareIds').value.split(',').map(x=>x.trim()).filter(x=>state.scenarios[x]);if(ids.length>1)api('/api/scenarios/x/comparison?ids='+encodeURIComponent(ids.join(','))).then(drawCompare).catch(()=>{})}
function drawCompare(d){$('compareBox').innerHTML=d.scenarios.map(x=>{const r=x.activeResult;return `<div class="card"><h3>${esc(x.scenario.id)} ${esc(x.scenario.name)}</h3><p class="${r.status==='ready'?'ok':'wait'}">${r.status}</p><p>值：<b>${fmt(r.value)} ${esc(r.unit)}</b><br>95% 覆盖区间：[${fmt(r.lowerBound)}, ${fmt(r.upperBound)}]</p><h4>敏感性</h4>${(r.sensitivities||[]).map(s=>`#${s.rank} ${esc(s.sourceId)} ∂y/∂x=${fmt(s.coefficient)} effect=${fmt(s.effect)}`).join('<br>')}${x.frozen?`<p class="ok">冻结包：${esc(x.frozen.id)}</p>`:''}</div>`}).join('')}
function fmt(x){return typeof x==='number'?Number(x).toPrecision(6):'-'}
const now=new Date();const future=new Date(now.getTime()+1000*60*60*24*365);$('validFrom').value=toLocal(now);$('expiresAt').value=toLocal(future);function toLocal(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
load();
</script></body></html>
